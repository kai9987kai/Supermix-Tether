[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supermix-tether"
version = "0.3.0"
description = "A CPU-local trainable laboratory for correct causal use of heterogeneous specialists"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3", "torch>=2.5,<3", "scikit-learn>=1.5,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
export = ["onnx>=1.16", "onnxruntime>=1.19"]

[project.scripts]
tether = "tether.__main__:main"

[tool.setuptools.packages.find]
include = ["tether*"]

[tool.setuptools.package-data]
tether = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

